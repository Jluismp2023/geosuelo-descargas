name: Publicar versión

# Se activa cuando llega la rama "subida" con GeoSuelo.apk y version.txt.
# Crea o actualiza la versión en Releases y borra la rama.
on:
  push:
    branches: [subida]

permissions:
  contents: write

concurrency:
  group: publicar
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Crear versión
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat version.txt)
          if gh release view "v$VERSION" --repo "${{ github.repository }}" > /dev/null 2>&1; then
            gh release upload "v$VERSION" GeoSuelo.apk --clobber --repo "${{ github.repository }}"
          else
            gh release create "v$VERSION" GeoSuelo.apk \
              --repo "${{ github.repository }}" --target main \
              --title "GeoSuelo $VERSION" \
              --notes "GeoSuelo para Android: granulometría, límites de Atterberg, clasificación SUCS y AASHTO, curva granulométrica, carta de plasticidad y faja MTOP. Gratis con anuncios; Premium sin anuncios por USD 2,99. Si tiene la 1.0.0, desinstálela una vez antes de instalar esta versión."
          fi
          git push origin --delete subida
